name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system media tools (ffmpeg, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install dependencies
        id: install
        run: bun install --no-frozen-lockfile
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Typecheck Worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc -p tsconfig.worker.json
      - name: Typecheck container
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc -p tsconfig.container.json
      - name: Unit + FFmpeg integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:unit
      - name: Worker API tests (D1/R2/Queues in workerd)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:worker
      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Dependency audit (high and above)
        run: bun audit --audit-level high
        continue-on-error: true

  container:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build media container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          push: false
          load: true
          tags: clipforge-media:ci
          cache-from: type=gha,scope=media
          cache-to: type=gha,mode=max,scope=media
      - name: Smoke test container toolchain and server
        run: |
          docker run --rm --entrypoint sh clipforge-media:ci -c "ffmpeg -version | head -1 && yt-dlp --version && python3 -c 'import cv2; print(cv2.__version__)' && fc-list | grep -qi dejavu && echo toolchain-ok"
          docker run -d --name media -p 8080:8080 clipforge-media:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/ping && break; sleep 1; done
          curl -fsS http://localhost:8080/ping
          docker rm -f media
