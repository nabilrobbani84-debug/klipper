name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clipforge
          POSTGRES_PASSWORD: clipforge
          POSTGRES_DB: clipforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clipforge -d clipforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://clipforge:clipforge@localhost:5432/clipforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system media tools (ffmpeg, fonts)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install dependencies
        run: bun install --no-frozen-lockfile
      - name: Typecheck (frontend + server)
        run: bun run lint
      - name: Unit, API, database and FFmpeg integration tests
        run: bun run test
      - name: Build frontend
        run: bun run build
      - name: Dependency audit (high and above)
        run: bun audit --audit-level high
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          tags: clipforge-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: clipforge-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Smoke test worker toolchain
        run: |
          docker run --rm --entrypoint sh clipforge-worker:ci -c "ffmpeg -version | head -1 && yt-dlp --version && whisper --help >/dev/null && python3 -c 'import cv2; print(cv2.__version__)' && fc-list | grep -qi dejavu && echo toolchain-ok"
