name: CI

on:
  pull_request:
  push:
    branches: [main, firebase-hosting-deploy]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Typecheck frontend and server
        run: bun run lint
      - name: Build frontend
        run: bun run build
      - name: Run tests
        run: bun run test
      - name: Build Docker image
        run: docker build --target runtime -t clipforge:ci .
      - name: Dependency audit
        run: bun audit --audit-level high
