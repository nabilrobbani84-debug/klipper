name: ClipForge AI Production CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Lint, Test & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Types & Syntax
        run: npm run lint

      - name: Execute Automated Test Suite (Security, Scoring, FFmpeg, Auth)
        run: npm run test

      - name: Build Production Client Bundle
        run: npm run build

      - name: Security Scan (Dependencies)
        run: npm audit --audit-level=high || true
