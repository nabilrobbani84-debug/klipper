name: Deploy frontend to Firebase Hosting (optional)

# Optional static-frontend deployment. The full product (API + worker) is deployed with Docker
# (see DEPLOY.md). This workflow only runs when the FIREBASE_SERVICE_ACCOUNT secret exists and
# VITE_API_URL points at your deployed API.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Skip when Firebase is not configured
        if: env.HAS_FIREBASE != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT secret or FIREBASE_PROJECT_ID variable not set; skipping Firebase deploy."
      - uses: actions/checkout@v4
        if: env.HAS_FIREBASE == 'true'
      - uses: oven-sh/setup-bun@v2
        if: env.HAS_FIREBASE == 'true'
      - name: Install dependencies
        if: env.HAS_FIREBASE == 'true'
        run: bun install
      - name: Build
        if: env.HAS_FIREBASE == 'true'
        run: bun run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Deploy to live channel
        if: env.HAS_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
