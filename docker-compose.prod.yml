# Production stack for a single VPS (e.g. 4 vCPU / 8 GB).
# Caddy terminates TLS and reverse-proxies to the API; the API serves the SPA and media.
# Storage is Cloudflare R2 (S3-compatible). Set all secrets in a `.env` file next to this.
#
#   DOMAIN=clips.example.com docker compose -f docker-compose.prod.yml up -d --build
#
services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "8080"
      SERVE_FRONTEND: "true"
      ALLOW_DEV_AUTH: "false"
      STORAGE_DRIVER: s3
    expose:
      - "8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      ALLOW_DEV_AUTH: "false"
      STORAGE_DRIVER: s3
    # Whisper + FFmpeg are CPU/RAM heavy — cap so one job can't starve the host.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6g
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  cleanup:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: s3
    # Run the retention job once a day.
    entrypoint: ["/bin/sh", "-c", "while true; do node --import tsx server/cleanup.ts || true; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-clipforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipforge}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
