# Local development stack. The API serves the built SPA on http://localhost:8080.
# For hot-reload frontend dev, run `bun run dev` on the host (it proxies to the API).
services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: "8080"
      APP_URL: http://localhost:8080
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080,http://localhost:3000
      STORAGE_DRIVER: local
      ALLOW_DEV_AUTH: "true"
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-at-least-32-characters}
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      ALLOW_DEV_AUTH: "true"
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-at-least-32-characters}
    volumes:
      - media-data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge -d clipforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  media-data:
