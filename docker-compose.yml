services:
  frontend:
    build:
      context: .
      target: build
    command: bun run dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api
  api:
    build:
      context: .
      target: runtime
    command: ["node", "--import", "tsx", "server/index.ts"]
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
      TEMP_DIR: /data/tmp
      CORS_ORIGIN: http://localhost:3000
      ALLOW_DEV_AUTH: "true"
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      target: runtime
    command: ["node", "--import", "tsx", "server/worker.ts"]
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /data/storage
      TEMP_DIR: /data/tmp
      ALLOW_DEV_AUTH: "true"
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge -d clipforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  media-data:
